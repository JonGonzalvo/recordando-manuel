<style>
/* Layout: a quiet memorial book. Portrait and dedication side by side, a full-width writing desk, then memories two to a row. Colors taken from the pine trail in his photo. The built page sets data-theme="dark". */
:root {
  --bg: #ECEEE8;
  --surface: #F5F6F2;
  --ink: #1D2520;
  --muted: #5B655D;
  --rule: #C9CEC3;
  --accent: #74462A;
  --accent-ink: #FFFFFF;
  --moss: #50603F;
  --field: #FFFFFF;
  --danger: #8E2F23;
  --display: "Libre Caslon Display", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121713; --surface: #19201B; --ink: #E4E7E0; --muted: #9AA398; --rule: #2D3630;
    --accent: #C99369; --accent-ink: #1B120B; --moss: #A1B48C; --field: #0F1310; --danger: #E08A7C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121713; --surface: #19201B; --ink: #E4E7E0; --muted: #9AA398; --rule: #2D3630;
  --accent: #C99369; --accent-ink: #1B120B; --moss: #A1B48C; --field: #0F1310; --danger: #E08A7C;
  color-scheme: dark;
}

/* Bilingual text: both languages sit in the same cell and only one is visible,
   so the slot is always sized for the longer one and nothing moves on toggle. */
.bi { display: inline-grid; max-width: 100%; }
.bi > span { grid-area: 1 / 1; min-width: 0; }
.bi > span:not(.on) { visibility: hidden; }
.lede > .bi, .translate-note > .bi, .composer-intro > .bi, .section-sub > .bi { display: grid; }
.link .bi > span { text-decoration: underline; text-underline-offset: 3px; }
.btn .bi, .tr-btn .bi { justify-items: center; text-align: center; }

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Language bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
}
.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 10px; }
.bar-name { font-family: var(--display); font-size: 1.25rem; letter-spacing: 0.01em; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 3px; background: var(--surface); flex: none; }
.seg button {
  border: 0; background: transparent; cursor: pointer;
  padding: 6px 14px; border-radius: 999px; font-size: 0.875rem; font-weight: 500; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* Hero */
.hero { padding-block: 56px 64px; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 56px; align-items: end; }
.portrait { margin: 0; }
.portrait img { display: block; width: 100%; height: auto; aspect-ratio: 661 / 1017; object-fit: cover; border-radius: 3px; background: var(--rule); }
.dedication { min-width: 0; display: grid; gap: 20px; padding-bottom: 8px; }
.eyebrow { font-size: 0.8125rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
h1 {
  font-family: var(--display); font-weight: 400; margin: 0;
  font-size: clamp(3rem, 6.2vw, 6rem); line-height: 0.95; letter-spacing: -0.01em;
}
h1 span { display: block; }
.lede { font-family: var(--serif); font-size: 1.25rem; line-height: 1.6; max-width: 34rem; margin: 0; text-wrap: pretty; }
.translate-note {
  display: flex; gap: 12px; align-items: flex-start; max-width: 34rem; margin: 0;
  border-top: 1px solid var(--rule); padding-top: 16px; color: var(--muted); font-size: 0.9375rem;
}
.hero-actions { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
.count { color: var(--muted); font-size: 0.9375rem; font-variant-numeric: tabular-nums; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid transparent; border-radius: 4px; cursor: pointer;
  padding: 11px 20px; font-size: 0.9375rem; font-weight: 600; text-decoration: none;
}
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.06); }
.btn[disabled] { opacity: 0.55; cursor: progress; }
.link { background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent); font-size: 0.875rem; text-decoration: underline; text-underline-offset: 3px; }

/* Sections */
.section { padding-block: 24px 56px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
h2 { font-family: var(--display); font-weight: 400; font-size: 2.25rem; margin: 0; text-wrap: balance; }
.section-sub { margin: 6px 0 0; color: var(--muted); font-family: var(--serif); font-style: italic; font-size: 1.0625rem; }

/* Composer: full width of the page, writing on the left, signature on the right */
.composer {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 28px;
  display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 22px 32px; align-items: start;
}
.composer-intro { grid-column: 1 / -1; margin: 0; color: var(--muted); max-width: 40rem; }
.composer-side { display: grid; gap: 18px; min-width: 0; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .field .label { font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.02em; }
textarea, input[type="text"] {
  width: 100%; background: var(--field); border: 1px solid var(--rule); border-radius: 4px; padding: 12px 14px;
}
textarea { font-family: var(--serif); font-size: 1.0625rem; line-height: 1.6; min-height: 288px; resize: vertical; display: block; }
textarea:focus, input[type="text"]:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.composer .seg { justify-self: start; }
.composer-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding-top: 4px; }
.status { font-size: 0.9375rem; color: var(--muted); min-height: 1.5em; margin: 0; }
.status.error { color: var(--danger); }
.hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }

/* Memories */
.memories { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.memory {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 28px;
  display: flex; flex-direction: column; gap: 22px; min-width: 0;
}
.memory.wide { grid-column: 1 / -1; }
.memory.wide .memory-body { max-width: 44rem; }
.memory-body { font-family: var(--serif); font-size: 1.125rem; line-height: 1.7; display: grid; gap: 0.9em; overflow-wrap: anywhere; }
.memory-body p { margin: 0; }
.memory-foot {
  margin-top: auto; padding-top: 16px; border-top: 1px solid var(--rule);
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; align-items: baseline;
}
.sig { display: grid; gap: 2px; min-width: 0; }
.sig-name { font-family: var(--serif); font-style: italic; font-size: 1.0625rem; }
.sig-ctx { color: var(--muted); font-size: 0.875rem; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: var(--muted); font-size: 0.8125rem; }
.meta .tag { color: var(--moss); }
.tr-btn {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--rule)); background: transparent; color: var(--accent);
  border-radius: 999px; padding: 4px 12px; font-size: 0.8125rem; font-weight: 600;
}
.tr-btn:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.tr-btn[disabled] { cursor: progress; opacity: 0.7; }
.tr-btn svg { width: 14px; height: 14px; flex: none; }
.tr-err { flex-basis: 100%; color: var(--danger); }
.confirm { display: inline-flex; gap: 10px; align-items: baseline; color: var(--danger); }
.link.danger { color: var(--danger); }
.empty { grid-column: 1 / -1; padding-block: 8px 32px; color: var(--muted); font-family: var(--serif); font-size: 1.125rem; margin: 0; }
.stale { grid-column: 1 / -1; color: var(--muted); font-size: 0.875rem; margin: 0 0 4px; }

.support { padding-block: 8px 40px; }
.support p { margin: 0; max-width: 40rem; font-family: var(--serif); font-size: 1.0625rem; color: var(--muted); }
.support a { color: var(--accent); text-underline-offset: 3px; }
footer { border-top: 1px solid var(--rule); padding-block: 28px 48px; color: var(--muted); font-size: 0.875rem; }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }

@media (max-width: 860px) {
  .hero { padding-block: 28px 40px; }
  .hero .wrap { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .portrait { max-width: 360px; }
  h1 { font-size: clamp(3rem, 11vw, 5rem); }
}
@media (max-width: 760px) {
  .composer { grid-template-columns: minmax(0, 1fr); padding: 20px; }
  textarea { min-height: 200px; }
  .lede { font-size: 1.125rem; }
  .memories { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .memory { padding: 22px 20px; }
  .bar-name { font-size: 1.0625rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .memory.is-new { animation: settle 900ms ease-out; }
  @keyframes settle { from { background: color-mix(in srgb, var(--accent) 10%, transparent); } to { background: var(--surface); } }
}
</style>

<script type="application/json" id="config">{"supabaseUrl":"https://gimqlhciucrallibgytv.supabase.co","publishableKey":"sb_publishable_SJZGWqsKwv9pQMyCvvNMLA_jjvvQm7C"}</script>
<script type="application/json" id="keepsake">{"updatedAt":"2026-11-25T21:39:33.923Z","entries":[{"id":"dcaccd9c-3545-4a8a-b68c-57b49bcf853d","createdAt":"2026-11-24T18:59:19.203214+00:00","signature":"Robert Martinez","original":"I switched from Freestone to join Manuel at Path LMS at the beginning of the year. Coming in to lead a team of strangers had me very nervous but Manuel welcomed me with the kindness and charm I've learned was his signature. He wasn't just welcoming but incredibly smart and clever and he made the transition so much easier for me when he absolutely didn't have to. He always went above and beyond not just at work but to ask about everyone's weekend or PTO in a way that made the endless video calls that much better. \n\nIn our chats between work topics Manuel loved to give me pointers on raising my young daughter and gushed about his triplets. I just wish I could've met him in person and shared a drink and a story. Thank you for everything Manuel. You'll be missed.","contextOriginal":"Coworker","source":"en","translations":{"es":{"story":"A principios de año dejé Freestone para unirme a Manuel en Path LMS. Llegar a dirigir a un equipo de desconocidos me tenía muy nervioso, pero Manuel me recibió con la amabilidad y el encanto que, según aprendí, eran su sello. No solo era acogedor, sino también increíblemente inteligente y ingenioso, y me hizo la transición mucho más fácil cuando para nada tenía que hacerlo. Siempre daba más de lo que se esperaba, no solo en el trabajo, sino también al preguntarle a todos por su fin de semana o sus vacaciones, de una manera que hacía que las interminables videollamadas fueran mucho mejores.\n\nEn nuestras pláticas, entre un tema de trabajo y otro, a Manuel le encantaba darme consejos para criar a mi hija pequeña y hablaba maravillas de sus trillizos. Solo quisiera haberlo podido conocer en persona y compartir una copa y una historia. Gracias por todo, Manuel. Te vamos a extrañar.","context":"Compañero de trabajo"}}},{"id":"44620d85-d0a7-4fca-9d91-226291a3eda5","createdAt":"2026-11-24T19:02:20.786112+00:00","signature":"Jan J","original":"I'll always remember Manuel for his kindness and interest he took in knowing how everyone was doing. Weeks could go by without us talking, but I was always so happy to see him. He never forgot to ask how I was doing personally. When I first met him in person, he loved sharing stories about his family and home. He loved the life and family he had so much.\n\nOne of my favorite things was our weather check-ins during meetings. He always wanted to know how hot or cold it was in my city. We'd trade complaints about the heat and rain all the time! It was small but will always leave a lasting memory.\n\nI hope the weather he's enjoying now is forever splendid. My condolences to the Crosthwaite family.","contextOriginal":"Coworker at Blue Sky eLearn","source":"en","translations":{"es":{"story":"Siempre recordaré a Manuel por su amabilidad y por el interés que tenía en saber cómo estaba cada uno. Podían pasar semanas sin que habláramos, pero siempre me daba mucho gusto verlo. Nunca se le olvidaba preguntarme cómo estaba en lo personal. Cuando lo conocí en persona, le encantaba compartir historias sobre su familia y su tierra. Amaba muchísimo la vida y la familia que tenía.\n\nUna de las cosas que más me gustaban eran nuestros reportes del clima durante las juntas. Siempre quería saber qué tanto calor o frío hacía en mi ciudad. ¡Todo el tiempo nos quejábamos juntos del calor y de la lluvia! Era algo pequeño, pero siempre será un recuerdo que perdure.\n\nOjalá el clima que ahora disfruta sea espléndido para siempre. Mis condolencias a la familia Crosthwaite.","context":"Compañero de trabajo en Blue Sky eLearn"}}},{"id":"39a2438e-3132-44cd-b0f9-ef4501375169","createdAt":"2026-11-24T19:23:41.782212+00:00","signature":"Jonathan Gonzalvo","original":"Manuel would always open every call asking about my family, about my newborn daughter and how she was sleeping (because I would always complain that I wasn't getting any sleep hahaha). He would ask me about my weekend on Mondays, and he would always share tips on raising and getting thru the tough first months. No matter how serious the meeting was, it for Manuel it was always about how we were doing first. He would say hi to EVERYONE in the call. I will keep this with me for as long as I live, the people we work and live life with are bigger than everything else.\n\nAs a co-worker he always showed up for the team. He helped in any way he could and volunteered to do things even if they weren't in his realm, he was a team player.\n\nAnother thing I will carry for ever is how he would always rave about his triplets and you could tell he LOVED his family. We had long talks in San Diego in the last Bluesky meet up, and it was awesome to hear him talk about his family and his culture. \n\nManuel, you will be missed, brother. Thank you for everything. We will have another 'mezcalito' on the other side.","contextOriginal":"","source":"en","translations":{"es":{"story":"Manuel siempre empezaba cada llamada preguntándome por mi familia, por mi hija recién nacida y cómo estaba durmiendo (porque yo siempre me quejaba de que no estaba durmiendo nada jajaja). Los lunes me preguntaba cómo me había ido el fin de semana, y siempre me compartía consejos para criar y sobrellevar los primeros meses, que son los más difíciles. Sin importar qué tan seria fuera la junta, para Manuel lo primero siempre era saber cómo estábamos. Saludaba a TODOS en la llamada. Esto me lo voy a llevar conmigo toda la vida: las personas con las que trabajamos y vivimos la vida son más importantes que todo lo demás.\n\nComo compañero de trabajo, siempre estuvo ahí para el equipo. Ayudaba en todo lo que podía y se ofrecía a hacer cosas aunque no le tocaran; era un gran compañero de equipo.\n\nOtra cosa que voy a llevar conmigo para siempre es cómo siempre hablaba maravillas de sus trillizos, y se notaba que AMABA a su familia. Tuvimos largas pláticas en San Diego en el último encuentro de Bluesky, y fue increíble escucharlo hablar de su familia y de su cultura.\n\nManuel, te vamos a extrañar, hermano. Gracias por todo. Nos tomaremos otro 'mezcalito' del otro lado.","context":""}}},{"id":"e2dc5800-b084-4b59-b578-11038177e728","createdAt":"2026-11-24T21:50:36.125618+00:00","signature":"Joy Earl","original":"Manuel shared his recent trip to my hometown of Houston and how excited he was to go with his family and buy a good cowboy hat. In his mind he expected everyone there to talk with a cowboy accent :) He asked if I missed anything from Houston and that he would ship anything to me right away.\n\nHis kindness and warmth will always stick with me as will his incredible work ethic, always willing to help out when the team needed help the most. He will be incredibly missed and has left a huge impact on myself and other coworkers with his genuine and simple acts of kindness. \n\nCoffee and Mezcal forever, Manuel.","contextOriginal":"coworker","source":"en","translations":{"es":{"story":"Manuel me platicó de su viaje reciente a Houston, mi ciudad natal, y de lo emocionado que estaba de ir con su familia y comprarse un buen sombrero vaquero. Él se imaginaba que allá todos iban a hablar con acento vaquero :) Me preguntó si extrañaba algo de Houston y me dijo que me lo mandaría de inmediato.\n\nSu bondad y su calidez siempre se quedarán conmigo, igual que su increíble ética de trabajo; siempre estaba dispuesto a echar la mano cuando el equipo más lo necesitaba. Lo vamos a extrañar muchísimo, y dejó una huella enorme en mí y en otros compañeros con sus gestos de bondad sinceros y sencillos.\n\nCafé y Mezcal por siempre, Manuel.","context":"compañero de trabajo"}}},{"id":"605068ba-b6e8-4b0c-8202-d34f8d311c6e","createdAt":"2026-11-24T23:28:43.247497+00:00","signature":"Gastón","original":"Tuve la fortuna de trabajar con Manuel unos 3 años en Bluesky E-Learn y luego en Momentive. Lo recuerdo como un gran ser humano, siempre con la intención de ayudar, de aportar su granito de arena incluso con cosas que no le correspondían. Coincidimos en el Hackathon de 2024, a donde llegó desde Tijuana en su camioneta, Buick recuerdo que era la marca y tuvimos charlas muy amenas en los trayectos a la oficina. Aún conservo la moneda de $10 MXN que me regaló cuando se dió cuenta que me gustaba coleccionar monedas de diferentes países. Yo le regalé una de pesos colombianos también. Ahora que no está más con nosotros en este mundo, quiero usar su recuerdo como una forma de aliviar mi dolor por su pérdida. Así mismo, se que lo siente el grupo de ingeniería de PathLMS, sus amigos y familiares. Estés donde estés, Manuel, gracias por compartir un poco de ese buen Mezcal, y por compartir tu bondad y tu humanidad con nosotros, aún en los momentos de trabajo más complejos. D.E.P","contextOriginal":"Compañero de Integrations","source":"es","translations":{"en":{"story":"I had the good fortune of working with Manuel for about 3 years at Bluesky E-Learn and then at Momentive. I remember him as a great human being, always wanting to help, to do his part even with things that weren't his responsibility. We were both at the 2024 Hackathon, which he drove to from Tijuana in his SUV, a Buick, I remember that was the make, and we had very enjoyable conversations on the drives to the office. I still have the $10 MXN coin he gave me when he realized I liked collecting coins from different countries. I gave him a Colombian peso coin too. Now that he is no longer with us in this world, I want to use his memory as a way to ease my pain over his loss. I know the PathLMS engineering team, his friends, and his family feel it too. Wherever you are, Manuel, thank you for sharing a bit of that good Mezcal, and for sharing your kindness and your humanity with us, even in the most difficult moments at work. R.I.P.","context":"Integrations teammate"}}},{"id":"35e4e22e-3f6c-4daa-868f-0371235d0d08","createdAt":"2026-11-25T12:53:10.648464+00:00","signature":"Bohdan","original":"Manuel was a wonderful colleague and, above all, a wonderful person. He was kind, generous, and always ready to help and support others. On every call and in every chat, he took the time to ask how everyone was doing and whether anyone needed a hand.\n\nI’m truly sorry I never got the chance to meet him in person. He will be deeply missed.","contextOriginal":"Coworker","source":"en","translations":{"es":{"story":"Manuel fue un compañero maravilloso y, sobre todo, una persona maravillosa. Era amable, generoso y siempre estaba dispuesto a ayudar y apoyar a los demás. En cada llamada y en cada chat, se tomaba el tiempo de preguntar cómo estaban todos y si alguien necesitaba una mano.\n\nDe verdad lamento no haber tenido nunca la oportunidad de conocerlo en persona. Lo vamos a extrañar muchísimo.","context":"Compañero de trabajo"}}},{"id":"9a8ee473-3854-4ab5-9750-c9f043070f66","createdAt":"2026-11-25T17:02:04.03025+00:00","signature":"Natalia","original":"I worked with Manuel for only a short time on the Integrations team, but he will always remain in my heart as an incredibly kind, genuine, and warm person.\nEvery conversation with Manuel began with him asking how I was doing and how my family was. He would ask about my country and about how we were coping with the war. His words were always sincere, thoughtful, and supportive, and I will always remember the kindness and compassion he showed.\nI also had the opportunity to work with Manuel on several different tasks, and I was always impressed by his professionalism, patience, and willingness to help. No matter the challenge, he approached everything with calmness, respect, and genuine care for the people around him.\nI feel very grateful that, even for a short time, I had the chance to know and work with Manuel. I will remember him not only as a wonderful colleague and professional, but above all as a truly kind and caring human being.\nMy deepest condolences to Manuel’s family, friends, and everyone who had the privilege of knowing him. He will be deeply missed and warmly remembered.","contextOriginal":"Coworker","source":"en","translations":{"es":{"story":"Trabajé con Manuel solo por poco tiempo en el equipo de Integrations, pero siempre permanecerá en mi corazón como una persona increíblemente amable, auténtica y cálida.\nCada conversación con Manuel empezaba con él preguntándome cómo estaba y cómo estaba mi familia. Me preguntaba por mi país y por cómo estábamos sobrellevando la guerra. Sus palabras siempre eran sinceras, atentas y solidarias, y siempre recordaré la bondad y la compasión que me mostró.\nTambién tuve la oportunidad de trabajar con Manuel en varias tareas distintas, y siempre me impresionaron su profesionalismo, su paciencia y su disposición para ayudar. Sin importar el reto, lo enfrentaba todo con calma, respeto y un interés genuino por las personas a su alrededor.\nMe siento muy agradecido de haber tenido la oportunidad, aunque fuera por poco tiempo, de conocer a Manuel y trabajar con él. Lo recordaré no solo como un compañero y profesional maravilloso, sino, sobre todo, como un ser humano verdaderamente amable y atento con los demás.\nMi más sentido pésame a la familia de Manuel, a sus amigos y a todos los que tuvieron el privilegio de conocerlo. Lo extrañaremos profundamente y lo recordaremos con mucho cariño.","context":"Compañero de trabajo"}}},{"id":"326f8049-f2e9-418f-a041-7466fc5d8038","createdAt":"2026-11-25T21:05:46.722556+00:00","signature":"Amy Rollins","original":"It's bittersweet that I had the opportunity to work more closely with Manuel over the past few months, because it allowed me to get to know what a genuinely warm person he was. I am heartbroken for his family, whom he spoke of so often. Any call I got on with him we'd talk about any adventures or outings we were planning with our kids, and he could have a friendly chat with anyone it seemed. Beyond that, he was an incredible helper and team player, and I was so lucky to have his support when we ran into tricky issues. I am grateful for the time I got to know him just a little better. I hope our thoughts give his family just a little glimpse into how appreciated and well regarded he was by the people he worked alongside when he had to focus his time away from them.","contextOriginal":"Coworker","source":"en","translations":{"es":{"story":"Es agridulce que haya tenido la oportunidad de trabajar más de cerca con Manuel en los últimos meses, porque eso me permitió conocer lo genuinamente cálida que era su persona. Tengo el corazón roto por su familia, de quien hablaba tan seguido. En cada llamada que teníamos, platicábamos de las aventuras o salidas que estábamos planeando con nuestros hijos, y parecía que podía tener una conversación amena con cualquiera. Además de eso, era increíblemente servicial y un gran compañero de equipo, y tuve mucha suerte de contar con su apoyo cuando nos topábamos con problemas complicados. Agradezco el tiempo en que pude conocerlo un poquito mejor. Espero que nuestras palabras le den a su familia aunque sea un pequeño vistazo de lo apreciado y estimado que era por las personas con quienes trabajaba durante el tiempo que tenía que pasar lejos de ellos.","context":"Compañero de trabajo"}}}]}</script>

<script>
(() => {
  "use strict";

  // ---------- Copy ----------
  const T = {
    en: {
      eyebrow: "In memory of",
      lede: "A place for everyone who knew Manuel to share stories, memories, and the ways he made our days better. His family reads these pages too, in Spanish.",
      translateNote: "Memories appear in the words they were written in. Under each one written in Spanish, a Translate button shows it in English.",
      shareCta: "Share a memory",
      shareTitle: "Share a memory",
      composerIntro: "Write in whichever language feels natural. Your memory is posted exactly as you write it, and it is translated so everyone can read it.",
      storyLabel: "Your memory",
      storyPh: "A story, something he taught you, a moment you'd like his family to know about…",
      writtenIn: "Written in",
      sigLabel: "Sign as",
      sigPh: "Your name",
      ctxLabel: "How you knew him (optional)",
      ctxPh: "e.g. Teammate on the mobile team",
      post: "Post memory",
      posting: "Posting…",
      posted: "Thank you. Your memory is in the book. You can remove it later from this same browser.",
      needStory: "Write a memory first.",
      needSig: "Add the name you'd like to sign with.",
      postFailed: "Your memory wasn't saved. Check your connection and post again; your words are still here.",
      memoriesTitle: "In our own words",
      memoriesSub: "The stories we carry with us.",
      loading: "Gathering memories…",
      stale: "Showing a saved copy. The newest memories may be missing; they'll appear once the connection returns.",
      empty: "No memories yet. Yours can be the first.",
      translateBtn: "Translate to English",
      translating: "Translating…",
      translatedFrom: "Translated from Spanish",
      showOriginal: "Show original",
      trFailed: "The translation didn't come through. Try again in a moment.",
      trBusy: "Too many translations at once. Try again in a moment.",
      remove: "Remove",
      removeQ: "Remove your memory?",
      removeYes: "Remove",
      cancel: "Cancel",
      removeFailed: "Couldn't remove it. Try again.",
      count1: "1 memory shared",
      countN: "{n} memories shared",
      footer: "Gathered with love by his coworkers.",
      alt: "Manuel Crosthwaite on horseback on a trail through a pine forest, wearing a black hat and an embroidered western shirt.",
      dateLocale: "en-US"
    },
    es: {
      eyebrow: "En memoria de",
      lede: "Para la familia de Manuel: aquí reunimos las historias y los recuerdos de quienes trabajamos con él, y las formas en que hizo mejores nuestros días. Ustedes también pueden dejar aquí sus propios recuerdos.",
      translateNote: "Los recuerdos escritos en inglés se muestran traducidos al español. Toca «Ver original» para leerlos tal como fueron escritos.",
      shareCta: "Comparte un recuerdo",
      shareTitle: "Comparte un recuerdo",
      composerIntro: "Escribe en el idioma que te salga más natural. Tu recuerdo se publica tal como lo escribes y se traduce para que todos puedan leerlo.",
      storyLabel: "Tu recuerdo",
      storyPh: "Una historia, algo que te enseñó, un momento que te gustaría que su familia conociera…",
      writtenIn: "Escrito en",
      sigLabel: "Firma como",
      sigPh: "Tu nombre",
      ctxLabel: "Cómo lo conociste (opcional)",
      ctxPh: "p. ej. Compañero del equipo de móvil",
      post: "Publicar recuerdo",
      posting: "Publicando…",
      posted: "Gracias. Tu recuerdo ya está en el libro. Puedes quitarlo después desde este mismo navegador.",
      needStory: "Escribe primero tu recuerdo.",
      needSig: "Agrega el nombre con el que quieres firmar.",
      postFailed: "Tu recuerdo no se guardó. Revisa tu conexión y vuelve a publicar; tus palabras siguen aquí.",
      memoriesTitle: "En nuestras propias palabras",
      memoriesSub: "Las historias que llevamos con nosotros.",
      loading: "Reuniendo recuerdos…",
      stale: "Mostrando una copia guardada. Puede que falten los recuerdos más recientes; aparecerán cuando vuelva la conexión.",
      empty: "Todavía no hay recuerdos. El tuyo puede ser el primero.",
      translateBtn: "Traducir al español",
      translating: "Traduciendo…",
      translatedFrom: "Traducido del inglés",
      showOriginal: "Ver original",
      trFailed: "La traducción no llegó. Inténtalo de nuevo en un momento.",
      trBusy: "Hay demasiadas traducciones a la vez. Inténtalo de nuevo en un momento.",
      remove: "Quitar",
      removeQ: "¿Quitar tu recuerdo?",
      removeYes: "Quitar",
      cancel: "Cancelar",
      removeFailed: "No se pudo quitar. Inténtalo de nuevo.",
      count1: "1 recuerdo compartido",
      countN: "{n} recuerdos compartidos",
      footer: "Reunido con cariño por sus compañeros de trabajo.",
      alt: "Manuel Crosthwaite a caballo en un sendero entre pinos, con sombrero negro y camisa vaquera bordada.",
      dateLocale: "es-MX"
    }
  };

  // ---------- Setup ----------
  const readJSON = (id, fallback) => {
    try { const v = JSON.parse(document.getElementById(id).textContent); return v && typeof v === "object" ? v : fallback; }
    catch { return fallback; }
  };
  const CFG = readJSON("config", {});
  const KS = readJSON("keepsake", {});
  const keepsake = Array.isArray(KS.entries) ? KS.entries : [];

  const store = {
    get(k, d) { try { const v = JSON.parse(localStorage.getItem(k) || "null"); return v ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  let lang = (() => {
    const s = store.get("manuel-lang", null);
    if (s === "en" || s === "es") return s;
    return (navigator.language || "").toLowerCase().startsWith("es") ? "es" : "en";
  })();

  const S = {
    mode: "loading",        // loading | live | stale
    entries: [],
    mine: store.get("manuel-mine", {}),   // { [memoryId]: deleteToken } for memories posted from this browser
    flipped: new Set(),     // ids toggled away from their default view
    trBusy: new Set(),
    trTried: new Set(),     // auto-translations already requested this visit
    trErr: new Map(),
    confirmId: null,
    newId: null,
    draft: Object.assign({ story: "", signature: "", context: "", source: "" }, store.get("manuel-draft", {})),
    posting: false,
    status: { key: "", error: false },
  };

  const t = (k) => (T[lang][k] ?? T.en[k] ?? "");
  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids) if (kid) n.append(kid);
    return n;
  };
  // Both languages stacked in one cell; only the current one is visible (see .bi in the styles).
  const biText = (textFor) => {
    const wrap = el("span", { class: "bi" });
    for (const l of ["en", "es"]) wrap.append(el("span", { lang: l, class: l === lang ? "on" : "", "aria-hidden": l === lang ? null : "true", text: textFor(l) }));
    return wrap;
  };
  const bi = (key) => biText((l) => T[l][key] ?? "");
  const translateIcon = () => {
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 16 16"); svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("fill", "none"); svg.setAttribute("stroke", "currentColor"); svg.setAttribute("stroke-width", "1.4");
    svg.setAttribute("stroke-linecap", "round"); svg.setAttribute("stroke-linejoin", "round");
    for (const d of ["M2 3.5h7", "M5.5 2v1.5", "M7.5 3.5c-.6 2.6-2.4 4.6-5 5.6", "M4 5.5c.8 1.4 2 2.5 3.4 3.1", "M8.5 14l2.75-6 2.75 6", "M9.4 12h3.7"]) {
      const p = document.createElementNS(ns, "path"); p.setAttribute("d", d); svg.append(p);
    }
    return svg;
  };

  // ---------- Supabase ----------
  const api = (path, opts = {}) => fetch(CFG.supabaseUrl + path, {
    ...opts,
    headers: { apikey: CFG.publishableKey, "Content-Type": "application/json", ...(opts.headers || {}) },
  });
  const toEntry = (r) => ({
    id: r.id, createdAt: r.created_at, signature: r.signature || "",
    original: r.original || "", contextOriginal: r.context || "",
    source: r.source === "es" ? "es" : "en", translations: r.translations || {},
  });
  async function loadMemories() {
    const res = await api("/rest/v1/memories?select=id,created_at,signature,context,original,source,translations&order=created_at.asc&limit=1000");
    if (!res.ok) throw new Error("load " + res.status);
    return (await res.json()).map(toEntry);
  }
  const sha256hex = async (s) => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)))]
    .map((b) => b.toString(16).padStart(2, "0")).join("");
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
    : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) => (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16)));

  // ---------- Static copy ----------
  function applyCopy() {
    document.documentElement.lang = lang;
    document.title = lang === "es" ? "Recordando a Manuel" : "Remembering Manuel";
    document.querySelectorAll("[data-i18n]").forEach((n) => n.replaceChildren(bi(n.dataset.i18n)));
    $("portrait").alt = t("alt");
    renderSupport();
    $("lang-es").setAttribute("aria-pressed", String(lang === "es"));
    $("lang-en").setAttribute("aria-pressed", String(lang === "en"));
    renderCount();
  }

  // A quiet, optional line about the family's fundraiser.
  const FUND_URL = "https://www.gofundme.com/f/todos-con-manuel-crosswhite";
  const SUPPORT = {
    en: ["For those who wish to support his family: ", "Todos con Manuel", " on GoFundMe."],
    es: ["Para quienes deseen apoyar a su familia: ", "Todos con Manuel", " en GoFundMe."],
  };
  function renderSupport() {
    const wrap = el("span", { class: "bi" });
    for (const l of ["en", "es"]) {
      const [before, name, after] = SUPPORT[l];
      wrap.append(el("span", { lang: l, class: l === lang ? "on" : "", "aria-hidden": l === lang ? null : "true" },
        before,
        el("a", { href: FUND_URL, target: "_blank", rel: "noopener noreferrer", tabindex: l === lang ? null : "-1", text: name }),
        after));
    }
    $("support").replaceChildren(wrap);
  }

  function setLang(l) {
    if (l === lang) return;
    lang = l;
    store.set("manuel-lang", l);
    S.flipped.clear(); S.trErr.clear();
    applyCopy();
    renderComposer();
    renderMemories();
  }
  $("lang-es").addEventListener("click", () => setLang("es"));
  $("lang-en").addEventListener("click", () => setLang("en"));

  function renderCount() {
    const n = S.entries.length;
    $("count").replaceChildren(biText((l) => (S.mode !== "loading" && n > 0)
      ? (n === 1 ? T[l].count1 : T[l].countN.replace("{n}", n)) : ""));
  }

  // ---------- Memories ----------
  const fmtDate = (iso) => {
    try { return new Intl.DateTimeFormat(t("dateLocale"), { month: "long", day: "numeric", year: "numeric" }).format(new Date(iso)); }
    catch { return ""; }
  };

  function paragraphs(text, textLang) {
    const body = el("div", { class: "memory-body", lang: textLang });
    String(text || "").split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean)
      .forEach((p) => body.append(el("p", { text: p })));
    return body;
  }

  const translationOf = (e, target) => {
    const x = e.translations && e.translations[target];
    return x && typeof x.story === "string" && x.story.trim() ? x : null;
  };

  // Short memories pair up two to a row; a long one, or one left without a partner, takes the full width.
  const isLong = (e) => e.original.length > 650 || e.original.split(/\n\s*\n/).filter((p) => p.trim()).length > 3;
  function layoutWide(list) {
    const wide = new Set();
    let pending = null;
    for (const e of list) {
      if (isLong(e)) { if (pending) wide.add(pending.id); pending = null; wide.add(e.id); }
      else if (pending) pending = null;
      else pending = e;
    }
    if (pending) wide.add(pending.id);
    return wide;
  }

  // In Spanish, English memories show translated by default; in English, Spanish ones show a Translate button.
  const autoTranslate = () => lang === "es";

  function memoryNode(e, wide) {
    const foreign = e.source !== lang;
    const tr = foreign ? translationOf(e, lang) : null;
    const wantTr = autoTranslate() ? !S.flipped.has(e.id) : S.flipped.has(e.id);
    const showTr = foreign && tr && wantTr;

    const text = showTr ? tr.story : e.original;
    const ctx = showTr ? (tr.context || e.contextOriginal) : e.contextOriginal;

    const meta = el("div", { class: "meta" });
    const d = fmtDate(e.createdAt);
    if (d) meta.append(el("span", { text: d }));

    if (foreign) {
      const busy = S.trBusy.has(e.id);
      if (showTr) {
        meta.append(el("span", { class: "tag" }, bi("translatedFrom")));
        meta.append(el("button", { class: "link", type: "button",
          onclick: () => { autoTranslate() ? S.flipped.add(e.id) : S.flipped.delete(e.id); renderMemories(); } }, bi("showOriginal")));
      } else if (busy) {
        meta.append(el("span", { class: "tag" }, bi("translating")));
      } else {
        meta.append(el("button", { class: "tr-btn", type: "button", onclick: () => translate(e, true) },
          translateIcon(), bi("translateBtn")));
      }
      if (S.trErr.has(e.id)) meta.append(el("span", { class: "tr-err", role: "status" }, bi(S.trErr.get(e.id))));
    }

    if (S.mine[e.id] && S.mode === "live") {
      if (S.confirmId === e.id) {
        meta.append(el("span", { class: "confirm" },
          bi("removeQ"),
          el("button", { class: "link danger", type: "button", onclick: () => removeEntry(e) }, bi("removeYes")),
          el("button", { class: "link", type: "button", onclick: () => { S.confirmId = null; renderMemories(); } }, bi("cancel"))
        ));
      } else {
        meta.append(el("button", { class: "link", type: "button", onclick: () => { S.confirmId = e.id; renderMemories(); } }, bi("remove")));
      }
    }

    const sig = el("div", { class: "sig" }, el("span", { class: "sig-name", text: "— " + e.signature }));
    if (ctx) sig.append(el("span", { class: "sig-ctx", text: ctx }));

    return el("article", { class: "memory" + (wide ? " wide" : "") + (S.newId === e.id ? " is-new" : ""), id: "m-" + e.id },
      paragraphs(text, showTr ? lang : e.source),
      el("div", { class: "memory-foot" }, sig, meta)
    );
  }

  function renderMemories() {
    const box = $("memories");
    box.replaceChildren();
    if (S.mode === "stale") box.append(el("p", { class: "stale" }, bi("stale")));
    if (S.mode === "loading" && !S.entries.length) { box.append(el("p", { class: "empty" }, bi("loading"))); renderCount(); return; }
    const list = S.entries.slice().sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
    if (!list.length) box.append(el("p", { class: "empty" }, bi("empty")));
    const wide = layoutWide(list);
    list.forEach((e) => box.append(memoryNode(e, wide.has(e.id))));
    renderCount();
    if (autoTranslate() && S.mode === "live") {
      list.filter((e) => e.source !== lang && !translationOf(e, lang) && !S.trTried.has(e.id)).forEach((e) => translate(e, false));
    }
  }

  // ---------- Translation ----------
  async function translate(e, byClick) {
    const target = lang;
    S.trErr.delete(e.id);
    if (translationOf(e, target)) {
      autoTranslate() ? S.flipped.delete(e.id) : S.flipped.add(e.id);
      renderMemories(); return;
    }
    if (S.trBusy.has(e.id) || S.mode !== "live") return;
    S.trTried.add(e.id);
    S.trBusy.add(e.id); renderMemories();
    try {
      const res = await api("/functions/v1/translate", { method: "POST", body: JSON.stringify({ id: e.id, target }) });
      if (!res.ok) throw { status: res.status };
      const r = await res.json();
      e.translations = { ...(e.translations || {}), [target]: { story: String(r.story || ""), context: String(r.context || "") } };
      if (byClick && !autoTranslate()) S.flipped.add(e.id);
    } catch (err) {
      if (byClick) S.trErr.set(e.id, err && err.status === 429 ? "trBusy" : "trFailed");
    }
    S.trBusy.delete(e.id);
    renderMemories();
  }

  // ---------- Composer ----------
  function renderComposer() {
    const slot = $("composer-slot");
    const active = document.activeElement && document.activeElement.id;
    slot.replaceChildren();

    const busy = S.posting;
    const source = S.draft.source || lang;
    const form = el("form", { class: "composer", novalidate: true });
    form.addEventListener("submit", (ev) => ev.preventDefault());
    form.append(el("p", { class: "composer-intro" }, bi("composerIntro")));

    const saveDraft = () => store.set("manuel-draft", S.draft);
    const story = el("textarea", { id: "story", maxlength: "8000", placeholder: t("storyPh"), lang: source });
    story.value = S.draft.story; story.disabled = busy;
    story.addEventListener("input", () => { S.draft.story = story.value; saveDraft(); });

    const sig = el("input", { type: "text", id: "signature", maxlength: "120", placeholder: t("sigPh"), autocomplete: "name" });
    sig.value = S.draft.signature; sig.disabled = busy;
    sig.addEventListener("input", () => { S.draft.signature = sig.value; saveDraft(); });

    const ctx = el("input", { type: "text", id: "context", maxlength: "200", placeholder: t("ctxPh") });
    ctx.value = S.draft.context; ctx.disabled = busy;
    ctx.addEventListener("input", () => { S.draft.context = ctx.value; saveDraft(); });

    // Left empty by people; bots that fill every field get a quiet no-op.
    const hp = el("input", { type: "text", id: "website", name: "website", tabindex: "-1", autocomplete: "off" });

    const pick = (v) => { S.draft.source = v; saveDraft(); renderComposer(); };
    const srcSeg = el("div", { class: "seg", role: "group", "aria-labelledby": "src-label" },
      el("button", { type: "button", id: "src-es", lang: "es", "aria-pressed": String(source === "es"), disabled: busy, text: "Español", onclick: () => pick("es") }),
      el("button", { type: "button", id: "src-en", lang: "en", "aria-pressed": String(source === "en"), disabled: busy, text: "English", onclick: () => pick("en") })
    );

    const status = el("p", { class: "status" + (S.status.error ? " error" : ""), role: "status" });
    if (S.status.key) status.append(bi(S.status.key));

    form.append(
      el("div", { class: "field" }, el("label", { for: "story" }, bi("storyLabel")), story),
      el("div", { class: "composer-side" },
        el("div", { class: "field" }, el("span", { class: "label", id: "src-label" }, bi("writtenIn")), srcSeg),
        el("div", { class: "field" }, el("label", { for: "signature" }, bi("sigLabel")), sig),
        el("div", { class: "field" }, el("label", { for: "context" }, bi("ctxLabel")), ctx),
        el("div", { class: "hp", "aria-hidden": "true" }, el("label", { for: "website", text: "Website" }), hp),
        el("div", { class: "composer-actions" },
          el("button", { class: "btn btn-primary", type: "button", id: "btn-post", disabled: busy, onclick: () => doPost(hp.value) }, bi(busy ? "posting" : "post"))
        ),
        status
      )
    );
    slot.append(form);

    if (active && $(active) && !$(active).disabled) $(active).focus();
  }

  async function doPost(honeypot) {
    if (!S.draft.story.trim()) { S.status = { key: "needStory", error: true }; renderComposer(); $("story")?.focus(); return; }
    if (!S.draft.signature.trim()) { S.status = { key: "needSig", error: true }; renderComposer(); $("signature")?.focus(); return; }

    S.posting = true; S.status = { key: "", error: false }; renderComposer();
    const id = uuid();
    const token = uuid() + uuid();
    const source = S.draft.source || lang;
    try {
      if (!honeypot) {
        const res = await api("/rest/v1/memories", {
          method: "POST",
          headers: { Prefer: "return=minimal" },
          body: JSON.stringify({
            id, source,
            signature: S.draft.signature.trim(),
            context: S.draft.context.trim(),
            original: S.draft.story.trim(),
            delete_token_hash: await sha256hex(token),
          }),
        });
        if (!res.ok) throw new Error("post " + res.status);
        S.mine[id] = token; store.set("manuel-mine", S.mine);
        // Translate into the other language right away so readers don't wait.
        api("/functions/v1/translate", { method: "POST", body: JSON.stringify({ id, target: source === "es" ? "en" : "es" }) })
          .then(() => refresh()).catch(() => {});
      }
      S.draft.story = ""; store.set("manuel-draft", S.draft);
      S.status = { key: "posted", error: false };
      S.newId = id;
      S.posting = false;
      renderComposer();
      await refresh();
      requestAnimationFrame(() => $("m-" + id)?.scrollIntoView({ behavior: "smooth", block: "center" }));
    } catch {
      S.posting = false;
      S.status = { key: "postFailed", error: true };
      renderComposer();
    }
  }

  async function removeEntry(e) {
    try {
      const res = await api("/rest/v1/rpc/delete_memory", { method: "POST", body: JSON.stringify({ p_id: e.id, p_token: S.mine[e.id] }) });
      if (!res.ok || (await res.json()) !== true) throw new Error();
      delete S.mine[e.id]; store.set("manuel-mine", S.mine);
      S.entries = S.entries.filter((x) => x.id !== e.id);
    } catch {
      S.status = { key: "removeFailed", error: true };
      renderComposer();
    }
    S.confirmId = null;
    renderMemories();
  }

  // ---------- Loading ----------
  let lastJSON = "";
  async function refresh() {
    try {
      const fresh = await loadMemories();
      // keep translations fetched during this visit if the list hasn't caught up yet
      const known = new Map(S.entries.map((x) => [x.id, x]));
      fresh.forEach((x) => { const k = known.get(x.id); if (k) x.translations = { ...(k.translations || {}), ...(x.translations || {}) }; });
      const json = JSON.stringify(fresh);
      const changed = json !== lastJSON || S.mode !== "live";
      lastJSON = json;
      S.entries = fresh;
      S.mode = "live";
      if (changed) renderMemories();
    } catch {
      if (S.mode !== "live") { S.entries = keepsake.slice(); S.mode = "stale"; renderMemories(); }
    }
  }

  applyCopy();
  renderComposer();
  if (keepsake.length) S.entries = keepsake.slice();
  renderMemories();
  if (CFG.supabaseUrl) refresh(); else { S.mode = "stale"; renderMemories(); }
  setInterval(() => { if (document.visibilityState === "visible" && !S.posting) refresh(); }, 60000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
})();
</script>

</body>
