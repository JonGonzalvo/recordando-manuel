<style>
/* Layout: a quiet memorial book. Portrait and dedication side by side, a full-width writing desk, then one column of letters. Colors taken from the pine trail in his photo. */
/* Inside Claude the page follows each viewer's theme; the family copy sets data-theme="dark" on <html> and is always dark. */
:root {
  --bg: #ECEEE8;
  --surface: #F5F6F2;
  --ink: #1D2520;
  --muted: #5B655D;
  --rule: #C9CEC3;
  --accent: #74462A;
  --accent-ink: #FFFFFF;
  --moss: #50603F;
  --field: #FFFFFF;
  --danger: #8E2F23;
  --display: "Libre Caslon Display", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121713; --surface: #19201B; --ink: #E4E7E0; --muted: #9AA398; --rule: #2D3630;
    --accent: #C99369; --accent-ink: #1B120B; --moss: #A1B48C; --field: #0F1310; --danger: #E08A7C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121713; --surface: #19201B; --ink: #E4E7E0; --muted: #9AA398; --rule: #2D3630;
  --accent: #C99369; --accent-ink: #1B120B; --moss: #A1B48C; --field: #0F1310; --danger: #E08A7C;
  color-scheme: dark;
}

/* Bilingual text: both languages sit in the same cell and only one is visible,
   so the slot is always sized for the longer one and nothing moves on toggle. */
.bi { display: inline-grid; max-width: 100%; }
.bi > span { grid-area: 1 / 1; min-width: 0; }
.bi > span:not(.on) { visibility: hidden; }
.lede > .bi, .translate-note > .bi, .composer-intro > .bi, .section-sub > .bi { display: grid; }
.link .bi > span { text-decoration: underline; text-underline-offset: 3px; }

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Language bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
}
.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 10px; }
.bar-name { font-family: var(--display); font-size: 1.25rem; letter-spacing: 0.01em; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 3px; background: var(--surface); flex: none; }
.seg button {
  border: 0; background: transparent; cursor: pointer;
  padding: 6px 14px; border-radius: 999px; font-size: 0.875rem; font-weight: 500; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* Hero */
.hero { padding-block: 56px 64px; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 56px; align-items: end; }
.portrait { margin: 0; }
.portrait img { display: block; width: 100%; height: auto; aspect-ratio: 661 / 1017; object-fit: cover; border-radius: 3px; background: var(--rule); }
.dedication { min-width: 0; display: grid; gap: 20px; padding-bottom: 8px; }
.eyebrow { font-size: 0.8125rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
h1 {
  font-family: var(--display); font-weight: 400; margin: 0;
  font-size: clamp(3rem, 6.2vw, 6rem); line-height: 0.95; letter-spacing: -0.01em;
}
h1 span { display: block; }
.lede { font-family: var(--serif); font-size: 1.25rem; line-height: 1.6; max-width: 34rem; margin: 0; text-wrap: pretty; }
.translate-note {
  display: flex; gap: 12px; align-items: flex-start; max-width: 34rem; margin: 0;
  border-top: 1px solid var(--rule); padding-top: 16px; color: var(--muted); font-size: 0.9375rem;
}
.hero-actions { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
.count { color: var(--muted); font-size: 0.9375rem; font-variant-numeric: tabular-nums; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid transparent; border-radius: 4px; cursor: pointer;
  padding: 11px 20px; font-size: 0.9375rem; font-weight: 600; text-decoration: none;
}
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.06); }
.btn[disabled] { opacity: 0.55; cursor: progress; }
.link { background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent); font-size: 0.875rem; text-decoration: underline; text-underline-offset: 3px; }

/* Sections */
.section { padding-block: 24px 56px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
h2 { font-family: var(--display); font-weight: 400; font-size: 2.25rem; margin: 0; text-wrap: balance; }
.column { max-width: 42rem; }

/* Composer: full width of the page, writing on the left, signature on the right */
.composer {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 28px;
  display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 22px 32px; align-items: start;
}
.composer-intro { grid-column: 1 / -1; margin: 0; color: var(--muted); max-width: 40rem; }
.composer-side { display: grid; gap: 18px; min-width: 0; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .field .label { font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.02em; }
textarea, input[type="text"] {
  width: 100%; background: var(--field); border: 1px solid var(--rule); border-radius: 4px; padding: 12px 14px;
}
textarea { font-family: var(--serif); font-size: 1.0625rem; line-height: 1.6; min-height: 288px; resize: vertical; display: block; }
textarea:focus, input[type="text"]:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.composer .seg { justify-self: start; }
.composer-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding-top: 4px; }
.status { font-size: 0.9375rem; color: var(--muted); min-height: 1.5em; margin: 0; }
.status.error { color: var(--danger); }

.notice { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 20px 24px; color: var(--muted); margin: 0; }

/* Memories */
.section-sub { margin: 6px 0 0; color: var(--muted); font-family: var(--serif); font-style: italic; font-size: 1.0625rem; }
.memories { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.memory {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 28px;
  display: flex; flex-direction: column; gap: 22px; min-width: 0;
}
.memory.wide { grid-column: 1 / -1; }
.memory.wide .memory-body { max-width: 44rem; }
.memory-foot { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--rule); }
.memory-body { font-family: var(--serif); font-size: 1.125rem; line-height: 1.7; display: grid; gap: 0.9em; overflow-wrap: anywhere; }
.memories > .empty { grid-column: 1 / -1; }
.memory-body p { margin: 0; }
.memory-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; align-items: baseline; }
.sig { display: grid; gap: 2px; min-width: 0; }
.sig-name { font-family: var(--serif); font-style: italic; font-size: 1.0625rem; }
.sig-ctx { color: var(--muted); font-size: 0.875rem; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: var(--muted); font-size: 0.8125rem; }
.meta .tag { color: var(--moss); }
.tr-btn {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--rule)); background: transparent; color: var(--accent);
  border-radius: 999px; padding: 4px 12px; font-size: 0.8125rem; font-weight: 600;
}
.tr-btn:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.tr-btn[disabled] { cursor: progress; opacity: 0.7; }
.tr-btn svg { width: 14px; height: 14px; flex: none; }
.tr-err { flex-basis: 100%; color: var(--danger); }
.confirm { display: inline-flex; gap: 10px; align-items: baseline; color: var(--danger); }
.link.danger { color: var(--danger); }
.empty { padding-block: 8px 32px; color: var(--muted); font-family: var(--serif); font-size: 1.125rem; margin: 0; }

footer { border-top: 1px solid var(--rule); padding-block: 28px 48px; color: var(--muted); font-size: 0.875rem; }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }

@media (max-width: 860px) {
  .hero { padding-block: 28px 40px; }
  .hero .wrap { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .portrait { max-width: 360px; }
  h1 { font-size: clamp(3rem, 11vw, 5rem); }
}
@media (max-width: 760px) {
  .composer { grid-template-columns: minmax(0, 1fr); padding: 20px; }
  textarea { min-height: 200px; }
  .lede { font-size: 1.125rem; }
  .memories { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .memory { padding: 22px 20px; }
  .bar-name { font-size: 1.0625rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .memory.is-new { animation: settle 900ms ease-out; }
  @keyframes settle { from { background: color-mix(in srgb, var(--accent) 10%, transparent); } to { background: transparent; } }
}
</style>

<header class="bar">
  <div class="wrap">
    <span class="bar-name">Manuel Crosthwaite</span>

      <button type="button" id="lang-es" lang="es" aria-pressed="false">Español</button>
      <button type="button" id="lang-en" lang="en" aria-pressed="false">English</button>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <figure class="portrait">
        <img src="manuel.jpg" id="portrait" width="661" height="1017" alt="">
      </figure>
      <div class="dedication">
        <div class="eyebrow" data-i18n="eyebrow"></div>
        <h1><span>Manuel</span> <span>Crosthwaite</span></h1>
        <p class="lede" data-i18n="lede" data-i18n-family="ledeFamily"></p>
        <p class="translate-note" data-i18n="translateNote" data-i18n-family="noteFamily"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#share" id="hero-share" data-i18n="shareCta"></a>
          <span class="count" id="count" aria-live="polite"></span>
        </div>
      </div>
    </div>
  </section>

  <section class="section" id="share">
    <div class="wrap">
      <div class="section-head"><h2 data-i18n="shareTitle"></h2></div>
      <div id="composer-slot"></div>
    </div>
  </section>

  <section class="section" id="memories-section">
    <div class="wrap">
      <div class="section-head">
        <div><h2 data-i18n="memoriesTitle"></h2><p class="section-sub" data-i18n="memoriesSub"></p></div>
      </div>
      <div class="memories" id="memories" aria-live="polite"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span data-i18n="footer"></span>
    <span>En memoria de Manuel Crosthwaite</span>
  </div>
</footer>

      n.replaceChildren(bi(key));
    });
    if (FAMILY) document.title = lang === "es" ? "Recordando a Manuel" : "Remembering Manuel";
    $("portrait").alt = t("alt");
    $("lang-es").setAttribute("aria-pressed", String(lang === "es"));
    $("lang-en").setAttribute("aria-pressed", String(lang === "en"));
    renderCount();
  }

  function setLang(l) {
    if (l === lang) return;
    lang = l;
    try { localStorage.setItem("manuel-lang", l); } catch {}
    S.showing.clear(); S.trErr.clear();
    applyCopy();
    renderComposer();
    renderMemories();
  }
  $("lang-es").addEventListener("click", () => setLang("es"));
  $("lang-en").addEventListener("click", () => setLang("en"));

  function allEntries() { return S.mode === "offline" ? keepsake : S.entries; }

  function renderCount() {
    const n = allEntries().length;
    const textFor = (l) => {
      const tl = (k) => T[l][k];
      let txt = (S.mode === "ready" || S.mode === "offline") && n > 0
        ? (n === 1 ? tl("count1") : tl("countN").replace("{n}", n)) : "";
      if (FAMILY && KS.updatedAt) {
        try {
          const d = new Intl.DateTimeFormat(tl("dateLocale"), { month: "long", day: "numeric", hour: "numeric", minute: "2-digit" }).format(new Date(KS.updatedAt));
          txt = (txt ? txt + " · " : "") + tl("updatedOn").replace("{d}", d);
        } catch {}
      }
      return txt;
    };
    const wrap = el("span", { class: "bi" });
    for (const l of ["en", "es"]) wrap.append(el("span", { lang: l, class: l === lang ? "on" : "", "aria-hidden": l === lang ? null : "true", text: textFor(l) }));
    $("count").replaceChildren(wrap);
  }

  // ---------- Memories ----------
  const fmtDate = (iso) => {
    try { return new Intl.DateTimeFormat(t("dateLocale"), { month: "long", day: "numeric", year: "numeric" }).format(new Date(iso)); }
    catch { return ""; }
  };

  function paragraphs(text, textLang) {
    const body = el("div", { class: "memory-body" });
    if (textLang) body.lang = textLang;
    String(text || "").split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean)
      .forEach((p) => body.append(el("p", { text: p })));
    return body;
  }

  function translationOf(e, target) {
    const x = (S.tr[e.id] && S.tr[e.id][target]) || (e.translations && e.translations[target]);
    return x && typeof x.story === "string" && x.story.trim() ? x : null;
  }

  // Short memories pair up two to a row; a long one, or one left without a partner, takes the full width.
  const isLong = (e) => {
    const txt = String(e.original || "");
    return txt.length > 650 || txt.split(/\n\s*\n/).filter((p) => p.trim()).length > 3;
  };
  function layoutWide(list) {
    const wide = new Set();
    let pending = null;
    for (const e of list) {
      if (isLong(e)) { if (pending) wide.add(pending.id); pending = null; wide.add(e.id); }
      else if (pending) pending = null;
      else pending = e;
    }
    if (pending) wide.add(pending.id);
    return wide;
  }

  function memoryNode(e, wide) {
    const src = e.source === "es" ? "es" : "en";
    const foreign = src !== lang;
    const tr = foreign ? translationOf(e, lang) : null;
    // On the family copy translations show by default; S.showing then holds the ones flipped back to the original.
    const showTr = foreign && tr && (FAMILY ? !S.showing.has(e.id) : S.showing.has(e.id));

    const text = showTr ? tr.story : e.original;
    const ctx = showTr ? (tr.context || e.contextOriginal || "") : (e.contextOriginal || "");

    const meta = el("div", { class: "meta" });
    const d = fmtDate(e.createdAt);
    if (d) meta.append(el("span", { text: d }));

    if (foreign) {
      if (showTr) {
        meta.append(el("span", { class: "tag" }, bi("translatedFrom")));
        meta.append(el("button", { class: "link", type: "button",
          onclick: () => { FAMILY ? S.showing.add(e.id) : S.showing.delete(e.id); renderMemories(); } }, bi("showOriginal")));
      } else if (tr || S.sample) {
        const busy = S.trBusy.has(e.id);
        const btn = el("button", { class: "tr-btn", type: "button", disabled: busy, onclick: () => translate(e) },
          translateIcon(), bi(busy ? "translating" : "translateBtn"));
        meta.append(btn);
      }
      if (S.trErr.has(e.id)) meta.append(el("span", { class: "tr-err", role: "status", text: t(S.trErr.get(e.id)) }));
    }

    const mayRemove = S.mode === "ready" && S.db && (S.isOwner || (S.uid && e.ownerId === S.uid));
    if (mayRemove) {
      if (S.confirmId === e.id) {
        meta.append(el("span", { class: "confirm" },
          el("span", { text: t("removeQ") }),
          el("button", { class: "link danger", type: "button", text: t("removeYes"), onclick: () => removeEntry(e) }),
          el("button", { class: "link", type: "button", text: t("cancel"), onclick: () => { S.confirmId = null; renderMemories(); } })
        ));
      } else {
        meta.append(el("button", { class: "link", type: "button", onclick: () => { S.confirmId = e.id; renderMemories(); } }, bi("remove")));
      }
    }

    const sig = el("div", { class: "sig" }, el("span", { class: "sig-name", text: "— " + (e.signature || "") }));
    if (ctx) sig.append(el("span", { class: "sig-ctx", text: ctx }));

    return el("article", { class: "memory" + (wide ? " wide" : "") + (S.newId === e.id ? " is-new" : ""), id: "m-" + e.id },
      paragraphs(text, showTr ? lang : src),
      el("div", { class: "memory-foot" }, sig, meta)
    );
  }

  function renderMemories() {
    const box = $("memories");
    box.replaceChildren();
    if (S.mode === "loading") { box.append(el("p", { class: "empty", text: t("loading") })); renderCount(); return; }
    if (S.mode === "slow" && !S.entries.length) { box.append(el("p", { class: "empty", text: t("slow") })); renderCount(); return; }
    const list = allEntries().slice().sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
    if (!list.length) {
      box.append(el("p", { class: "empty", text: S.mode === "offline" ? t("emptyKeepsake") : t("empty") }));
    } else {
      const wide = layoutWide(list);
      list.forEach((e) => box.append(memoryNode(e, wide.has(e.id))));
    }
    renderCount();
  }

  // ---------- Translation, on demand ----------
  async function translate(e) {
    const target = lang;
    S.trErr.delete(e.id);
    const cached = translationOf(e, target);
    if (cached) { FAMILY ? S.showing.delete(e.id) : S.showing.add(e.id); renderMemories(); return; }
    if (!S.sample || S.trBusy.has(e.id)) return;

    S.trBusy.add(e.id); renderMemories();
    const from = LANG_NAME[e.source === "es" ? "es" : "en"];
    const to = LANG_NAME[target];
    const prompt =
`Translate a short memorial message from ${from} to ${to}. A coworker wrote it about Manuel Crosthwaite, a colleague who passed away. His coworkers read the page in English; his family in Mexico reads it in Spanish.

- Spanish should read as natural, warm Mexican Spanish. English should read as natural American English.
- Stay faithful to meaning and tone. Do not add, soften, embellish, explain, or leave anything out.
- Keep names, nicknames, inside jokes, and quoted phrases as written. Keep paragraph breaks.
- If the writer speaks to the family directly, use "ustedes" in Spanish.
- If CONTEXT is empty, return an empty string for it.

Reply with only JSON in this shape:
{"story":"...","context":"..."}

MESSAGE:
"""
${e.original}
"""

CONTEXT:
"""
${e.contextOriginal || ""}
"""`;
    try {
      const r = await S.sample.json(prompt, { modelTier: "default" });
      if (!r || typeof r.story !== "string" || !r.story.trim()) throw { code: "invalid_json" };
      const result = { story: r.story.trim(), context: e.contextOriginal ? String(r.context || "").trim() : "" };
      S.tr[e.id] = { ...(S.tr[e.id] || {}), [target]: result };
      if (lang === target) S.showing.add(e.id);
      saveTranslation(e.id, target, result);   // share it so the next reader doesn't wait
    } catch (err) {
      const code = err && err.code;
      S.trErr.set(e.id, code === "not_granted" ? "trDeclined" : code === "rate_limited" ? "trBusy" : "trFailed");
    }
    S.trBusy.delete(e.id);
    renderMemories();
  }

  async function saveTranslation(id, target, result) {
    if (!S.db) return;
    try {
      const ref = S.db.collection("translations").doc(id);
      const cur = await ref.get();
      const body = cur.exists ? { ...cur.data() } : {};
      body[target] = result;
      await ref.set(body);
    } catch { /* readers without write access still see their own translation */ }
  }

  // ---------- Composer ----------
  function renderComposer() {
    const slot = $("composer-slot");
    const active = document.activeElement && document.activeElement.id;
    slot.replaceChildren();
    $("share").hidden = false; $("hero-share").hidden = false;

    if (FAMILY) { $("share").hidden = true; $("hero-share").hidden = true; return; }
    if (S.mode === "offline") {
      if (keepsake.length) { $("share").hidden = true; $("hero-share").hidden = true; }  // family keepsake: no composer
      slot.append(el("p", { class: "notice", text: t("signedOut") }));
      return;
    }
    if (S.canWrite === false || (S.mode === "ready" && S.db && !S.uid)) {
      slot.append(el("p", { class: "notice", text: t("noAccess") }));
      return;
    }

    const busy = S.posting;
    const source = S.draft.source || lang;
    const form = el("form", { class: "composer", novalidate: true });
    form.addEventListener("submit", (ev) => ev.preventDefault());
    form.append(el("p", { class: "composer-intro" }, bi("composerIntro")));

    const story = el("textarea", { id: "story", maxlength: "8000", placeholder: t("storyPh"), lang: source });
    story.value = S.draft.story; story.disabled = busy;
    story.addEventListener("input", () => { S.draft.story = story.value; saveDraft(); });

    const sig = el("input", { type: "text", id: "signature", maxlength: "120", placeholder: t("sigPh"), autocomplete: "name" });
    sig.value = S.draft.signature; sig.disabled = busy;
    sig.addEventListener("input", () => { S.draft.signature = sig.value; saveDraft(); });

    const ctx = el("input", { type: "text", id: "context", maxlength: "200", placeholder: t("ctxPh") });
    ctx.value = S.draft.context; ctx.disabled = busy;
    ctx.addEventListener("input", () => { S.draft.context = ctx.value; saveDraft(); });

    const pick = (v) => { S.draft.source = v; saveDraft(); renderComposer(); };
    const srcSeg = el("div", { class: "seg", role: "group", "aria-labelledby": "src-label" },
      el("button", { type: "button", id: "src-es", lang: "es", "aria-pressed": String(source === "es"), disabled: busy, text: "Español", onclick: () => pick("es") }),
      el("button", { type: "button", id: "src-en", lang: "en", "aria-pressed": String(source === "en"), disabled: busy, text: "English", onclick: () => pick("en") })
    );

    const statusText = S.posting ? t("posting") : (S.status.key ? t(S.status.key) : "");

    form.append(
      el("div", { class: "field" }, el("label", { for: "story" }, bi("storyLabel")), story),
      el("div", { class: "composer-side" },
        el("div", { class: "field" }, el("span", { class: "label", id: "src-label" }, bi("writtenIn")), srcSeg),
        el("div", { class: "field" }, el("label", { for: "signature" }, bi("sigLabel")), sig),
        el("div", { class: "field" }, el("label", { for: "context" }, bi("ctxLabel")), ctx),
        el("div", { class: "composer-actions" },
          el("button", { class: "btn btn-primary", type: "button", id: "btn-post", disabled: busy, onclick: doPost }, bi(busy ? "posting" : "post"))
        ),
        el("p", { class: "status" + (S.status.error ? " error" : ""), role: "status", text: statusText })
      )
    );
    slot.append(form);

    if (active && $(active) && !$(active).disabled) $(active).focus();
  }

  // Draft survives a reload in this browser only.
  function saveDraft() { try { localStorage.setItem("manuel-draft", JSON.stringify(S.draft)); } catch {} }
  try {
    const d = JSON.parse(localStorage.getItem("manuel-draft") || "null");
    if (d && typeof d === "object") Object.assign(S.draft, {
      story: String(d.story || ""), signature: String(d.signature || ""), context: String(d.context || ""),
      source: d.source === "es" || d.source === "en" ? d.source : ""
    });
  } catch {}

  const newId = () => (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2)));

  async function doPost() {
    if (!S.draft.story.trim()) { S.status = { key: "needStory", error: true }; renderComposer(); $("story")?.focus(); return; }
    if (!S.draft.signature.trim()) { S.status = { key: "needSig", error: true }; renderComposer(); $("signature")?.focus(); return; }
    if (!S.db || !S.uid) return;

    S.posting = true; S.status = { key: "", error: false }; renderComposer();
    const entry = {
      id: newId(),
      createdAt: new Date().toISOString(),
      signature: S.draft.signature.trim(),
      original: S.draft.story.trim(),
      contextOriginal: S.draft.context.trim(),
      source: S.draft.source || lang
    };

    try {
      const ref = S.db.collection("stories").doc(S.uid);
      const cur = await ref.get();
      const list = cur.exists && Array.isArray(cur.data().entries) ? cur.data().entries.slice() : [];
      list.push(entry);
      await ref.set({ entries: list });
      S.draft.story = "";
      saveDraft();
      S.status = { key: "posted", error: false };
      S.newId = entry.id;
      S.posting = false;
      renderComposer();
      requestAnimationFrame(() => $("m-" + entry.id)?.scrollIntoView({ behavior: "smooth", block: "center" }));
    } catch (e) {
      S.posting = false;
      if (e && e.code === "invalid_argument") { S.canWrite = false; S.status = { key: "", error: false }; }
      else S.status = { key: "postFailed", error: true };
      renderComposer();
    }
  }

  async function removeEntry(e) {
    try {
      const ref = S.db.collection("stories").doc(e.ownerId);
      const cur = await ref.get();
      const list = cur.exists && Array.isArray(cur.data().entries) ? cur.data().entries.filter((x) => x.id !== e.id) : [];
      await ref.set({ entries: list });
      S.confirmId = null;
    } catch {
      S.confirmId = null;
      S.status = { key: "removeFailed", error: true };
      renderComposer();
    }
    renderMemories();
  }

  // ---------- Boot ----------
  applyCopy();
  renderComposer();
  renderMemories();

  const use = (name) => (window.claude && typeof window.claude.use === "function") ? window.claude.use(name).catch(() => null) : Promise.resolve(null);

  (async () => {
    if (FAMILY) { S.mode = "offline"; renderComposer(); renderMemories(); return; }
    const [db, user, sample] = await Promise.all([use("db"), use("user"), use("sample")]);
    S.sample = sample;

    if (!db) {
      S.mode = "offline";
      renderComposer(); renderMemories();
      return;
    }
    S.db = db;

    if (user) {
      const me = await user.me();
      S.uid = me.id;
      S.isOwner = !!me.isOwner;
      S.canWrite = await user.can("data.write");
      if (!S.draft.signature && me.name) S.draft.signature = me.name;
    }

    const timer = setTimeout(() => { if (S.mode === "loading") { S.mode = "slow"; renderMemories(); } }, 10000);
    db.collection("stories").onSnapshot((snap) => {
      const all = [];
      snap.docs.forEach((d) => {
        const data = d.data() || {};
        (Array.isArray(data.entries) ? data.entries : []).forEach((x) => {
          if (x && typeof x === "object" && x.id && typeof x.original === "string") all.push({ ...x, ownerId: d.id });
        });
      });
      S.entries = all;
      const before = S.mode;
      if (!snap.metadata.fromCache) { clearTimeout(timer); S.mode = "ready"; }
      else if (S.mode === "loading" && all.length) S.mode = "ready";
      renderMemories();
      if (before !== S.mode) renderComposer();   // don't rebuild the form under someone who is typing
    }, () => {
      clearTimeout(timer);
      S.mode = S.entries.length ? "ready" : "slow";
      renderMemories();
    });

    db.collection("translations").onSnapshot((snap) => {
      const next = {};
      snap.docs.forEach((d) => { const v = d.data(); if (v && typeof v === "object") next[d.id] = v; });
      // keep translations this reader just made, in case their save was refused
      for (const [id, v] of Object.entries(S.tr)) next[id] = { ...v, ...(next[id] || {}) };
      S.tr = next;
      if (S.mode === "ready") renderMemories();
    }, () => {});

    renderComposer();
  })();
})();
</script>

</body>
</html>
